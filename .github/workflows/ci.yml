name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PORCH_TEST_TURBO_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-ci.yml-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global turbo@2.6.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --all-targets
      - run: cargo build --release
  windows:
    # The CLI and tray must build and lint clean, the CLI must smoke-start
    # without state, packaging must work and unit tests must pass. Integration
    # tests run for signal only until they pass on Windows.
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-windows-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features tray --all-targets -- -D warnings
      - run: cargo build --release --bin porch
      - run: cargo build --release --features tray --bin porch-tray
      - name: CLI starts without existing state
        shell: pwsh
        run: target/release/porch.exe --state-dir "$env:RUNNER_TEMP/porch-smoke" list --json
      - run: python scripts/test_packaging.py
      - run: python scripts/package.py --target x86_64-pc-windows-msvc --binaries target/release
      - run: cargo test --no-fail-fast --lib
      - name: Integration tests (not yet required)
        continue-on-error: true
        # A hung test must not hold the job until GitHub's 6-hour limit.
        timeout-minutes: 15
        run: cargo test --no-fail-fast --tests
  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-tray-${{ hashFiles('Cargo.lock') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: cargo clippy --features tray --all-targets -- -D warnings
      - run: cargo test --features tray --lib tray::tests
      - run: python3 scripts/test_packaging.py
      - run: cargo build --release --bin porch
      - run: cargo build --release --features tray --bin porch-tray
      - if: runner.os == 'Linux'
        name: Headless CLI stays independent of desktop libraries
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY target/release/porch --state-dir "$RUNNER_TEMP/porch-headless" list --json
          if ldd target/release/porch | grep -Ei 'gtk|gdk|appindicator|cairo'; then exit 1; fi
          python3 - <<'PY'
          import os, subprocess
          env = dict(os.environ)
          env.pop('DISPLAY', None)
          env.pop('WAYLAND_DISPLAY', None)
          env['PORCH_BIN'] = os.path.abspath('target/release/porch')
          result = subprocess.run(['target/release/porch-tray'], env=env, capture_output=True, text=True, timeout=10)
          assert result.returncode != 0, result
          assert 'porch list --all' in result.stderr, result.stderr
          PY
