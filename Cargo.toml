[package]
name = "porch"
version = "0.4.2"
edition = "2021"
description = "Stable named URLs for local dev servers, across your machines"
license = "MIT"
repository = "https://github.com/akshitkrnagpal/porch"
homepage = "https://github.com/akshitkrnagpal/porch"
readme = "README.md"
keywords = ["dev-server", "proxy", "localhost", "monorepo", "tailscale"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
# Default features off: they add native-tls (OpenSSL on Linux) beside rustls.
# HTTP/2, system proxy settings and charset decoding are the remaining
# defaults, kept on purpose. rustls uses the OS trust store like native-tls did.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "http2", "charset", "system-proxy"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
# Only what Porch uses: the legacy pooled client and the HTTP/1+2 auto server.
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio", "http1", "http2"] }
http-body-util = "0.1"
tower-service = "0.3"
psl = "2"
futures-util = "0.3"
tokio-tungstenite = "0.28"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
url = "2"
bytes = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "http2", "ring", "tls12"] }
sha2 = "0.10"
sha1 = "0.10"
x509-parser = "0.16"
mdns-sd = "0.17"
serde_norway = "0.9"
socket2 = "0.6"
getrandom = "0.3"

rustls-native-certs = "0.8"
spake2 = "0.4"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = []
tray = ["dep:tray-icon", "dep:tao", "dep:gtk", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[[bin]]
name = "porch-tray"
path = "src/bin/porch-tray.rs"
required-features = ["tray"]

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
tray-icon = { version = "0.26", optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = { version = "0.37", optional = true }

# Apple-only crates; they fail to compile anywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 ={ version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSAttributedString", "NSDictionary", "NSGeometry", "NSObject", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSAttributedString", "NSCell", "NSColor", "NSControl", "NSFont", "NSMenu", "NSEvent", "NSMenuItem", "NSProgressIndicator", "NSResponder", "NSSwitch", "NSText", "NSTextField", "NSView"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[profile.dev]
# Keep only line tables in debug builds: much smaller target/, and
# backtraces still show file:line.
debug = "line-tables-only"

[profile.release]
# Release archives were mostly symbol tables and duplicated generic code. These
# settings cut `porch` from 15.7 MB to about 6 MB on aarch64-apple-darwin with
# no measurable change in proxy CPU per request; opt-level "z" was smaller
# still but cost 15-25% more CPU. Panics still unwind. See
# docs/release-size.md for the measurements.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
