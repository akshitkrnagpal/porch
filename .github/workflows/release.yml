name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: porch
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: porch
    runs-on: ${{ matrix.os }}
    env:
      PORCH_TEST_TURBO_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-release.yml-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global turbo@2.6.3
      - run: cargo test --no-fail-fast --release --target ${{ matrix.target }} --all-targets
      - run: cargo build --release --target ${{ matrix.target }} --bin porch
      - uses: actions/upload-artifact@v4
        with:
          name: porch-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
