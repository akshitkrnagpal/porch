name: CI
# Branches are tested through their pull request; pushes run only for main,
# so one commit never runs the full matrix twice. Release tags are tested by
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels its superseded run. Every push to
  # main and every manual run gets its own group, so each is tested to the end.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PORCH_TEST_TURBO_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Dependencies only, keyed per job, OS, toolchain and Cargo.lock, and
      # restored from an older lockfile when it changes. Saving only on main
      # keeps branch and pull request copies from evicting main's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: true # TEMP: measurement only, revert before merge
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global turbo@2.6.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --all-targets
      # The only release build of the CLI. This job never installs desktop
      # libraries or enables the tray feature, so the check below proves the
      # headless CLI neither needs nor links them.
      - run: cargo build --release --bin porch
      - if: runner.os == 'Linux'
        name: Headless CLI stays independent of desktop libraries
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY target/release/porch --state-dir "$RUNNER_TEMP/porch-headless" list --json
          if ldd target/release/porch | grep -Ei 'gtk|gdk|appindicator|cairo'; then exit 1; fi
  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: true # TEMP: measurement only, revert before merge
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: cargo clippy --features tray --all-targets -- -D warnings
      - run: cargo test --features tray --lib tray::tests
      - run: python3 scripts/test_packaging.py
      - run: cargo build --release --features tray --bin porch-tray
      - if: runner.os == 'Linux'
        name: Tray fails clearly without a desktop
        run: |
          # The CLI is never invoked before the desktop check fails, so a
          # placeholder satisfies PORCH_BIN; the real CLI is built by `test`.
          printf '#!/bin/sh\nexit 97\n' > "$RUNNER_TEMP/porch"
          chmod +x "$RUNNER_TEMP/porch"
          python3 - <<'PY'
          import os, subprocess
          env = dict(os.environ)
          env.pop('DISPLAY', None)
          env.pop('WAYLAND_DISPLAY', None)
          env['PORCH_BIN'] = os.path.join(os.environ['RUNNER_TEMP'], 'porch')
          result = subprocess.run(['target/release/porch-tray'], env=env, capture_output=True, text=True, timeout=10)
          assert result.returncode != 0, result
          assert 'porch list --all' in result.stderr, result.stderr
          PY
