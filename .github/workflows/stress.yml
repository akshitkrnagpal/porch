name: Stress (temporary)
# TEMPORARY: repeats the test suite to show it is deterministic. Removed
# before merge.
on:
  push:
    branches: [fix/flaky-tests]
permissions:
  contents: read
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PORCH_TEST_TURBO_REQUIRED: ${{ matrix.os != 'windows-2025' && '1' || '' }}
      ROUNDS: 8
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global turbo@2.6.3
      - name: Build test binaries (release, like the release workflow)
        shell: bash
        run: |
          cargo test --release --all-targets --no-run --message-format=json \
            | jq -r 'select(.profile.test==true) | .executable' | tr -d '\r' > bins.txt
          cat bins.txt
      - name: Repeat the suite with two concurrent loops for extra load
        shell: bash
        run: |
          mkdir -p stress-logs
          # Windows runs one test at a time so the test in flight is known if
          # the console is torn down.
          threads=""
          if [ "$RUNNER_OS" = Windows ]; then threads="--test-threads=1"; fi
          loop() {
            local fails=0
            for round in $(seq "$ROUNDS"); do
              for bin in $(cat bins.txt); do
                local log="stress-logs/$1-$round-$(basename "$bin").log"
                echo "START $(date +%T) $(basename "$bin")" >> "stress-logs/progress-$1"
                if ! "$bin" $threads > "$log" 2>&1; then
                  fails=$((fails + 1))
                  echo "::error::loop $1 round $round $(basename "$bin") failed"
                  tail -80 "$log"
                fi
              done
            done
            echo "loop $1: $ROUNDS rounds, $fails failing binaries"
            return $fails
          }
          loop a & a=$!
          loop b & b=$!
          status=0
          wait $a || status=1
          wait $b || status=1
          exit $status
      - name: Show the tests in flight
        if: always()
        shell: bash
        run: |
          for p in stress-logs/progress-*; do
            echo "== $p"; tail -3 "$p"
            last=$(tail -1 "$p" | awk '{print $3}')
            loop=${p##*-}
            log=$(ls -t stress-logs/$loop-*-"$last".log 2>/dev/null | head -1)
            echo "-- $log"; tail -15 "$log"
          done
