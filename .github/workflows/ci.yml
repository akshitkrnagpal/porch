name: CI
# Branches are tested through their pull request; pushes run only for main,
# so one commit never runs the full matrix twice. Release tags are tested by
# release.yml.
#
# Changes that cannot affect a build or test skip CI entirely: documentation,
# screenshots and the release workflow (which only runs on tags). Later
# patterns win, so packaging/README.md still runs CI: release archives ship
# it as their README and scripts/test_packaging.py checks it is present.
# Keep both lists the same. No status check is required on main, so a
# skipped run never blocks a merge.
#
# Actions are pinned to full commit SHAs, with the version in a comment;
# update both together. ci.yml produces nothing that is published, so it may
# use caches; release.yml does not.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!assets/screenshots/**'
      - '!.github/workflows/release.yml'
      - 'packaging/README.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!assets/screenshots/**'
      - '!.github/workflows/release.yml'
      - 'packaging/README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels its superseded run. Every push to
  # main and every manual run gets its own group, so each is tested to the end.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deny:
    # Known vulnerabilities, unmaintained crates, licenses and sources.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PORCH_TEST_TURBO_REQUIRED: "1"
      # tests/e2e.rs installs real Vite from npm and drives its HMR socket.
      PORCH_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy
      # Dependencies only, keyed per job, OS, toolchain and Cargo.lock, and
      # restored from an older lockfile when it changes. Saving only on main
      # keeps branch and pull request copies from evicting main's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # turbo has no install scripts; its platform binaries are exact versions.
      - run: npm install --global --ignore-scripts turbo@2.6.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --all-targets
      # This job never installs desktop libraries or enables the tray feature,
      # so the check below proves the headless CLI neither needs nor links
      # them. It uses the debug binary `cargo test` already built: linkage is
      # the same as a release build, without a second full compile.
      - if: runner.os == 'Linux'
        name: Headless CLI stays independent of desktop libraries and OpenSSL
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/porch --state-dir "$RUNNER_TEMP/porch-headless" list --json
          if ldd target/debug/porch | grep -Ei 'gtk|gdk|appindicator|cairo|libssl|libcrypto'; then exit 1; fi
  windows:
    # The CLI and tray must build and lint clean, the CLI must smoke-start
    # without state, packaging must work, and unit and integration tests must
    # pass. Some integration suites are still Unix-only and run nothing here.
    #
    # Everything here uses debug builds: `cargo test` already builds the CLI
    # for the integration tests, so the smoke start and packaging reuse it
    # instead of paying for two optimized compiles. Nothing in the source
    # depends on the build profile; release.yml still builds and smoke-tests
    # the optimized Windows binaries for every tag, and a manual run of it
    # checks them before tagging.
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: clippy
      # rust-cache never re-saves a key it restored exactly, and the key only
      # follows Cargo.lock and the toolchain. Change `key` when this job starts
      # building different artifacts, so main saves a cache that has them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: debug-builds
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The tray feature only adds code (src/tray.rs and porch-tray), so this
      # lints every Windows path the featureless build has and more. The
      # featureless lint runs in `test` on Linux and macOS.
      - run: cargo clippy --features tray --all-targets -- -D warnings
      - name: Tray menu tests
        timeout-minutes: 10
        run: cargo test --features tray --lib tray::tests
      - name: Unit and integration tests
        # `--tests` includes the library's unit tests. A hung test must not
        # hold the job until GitHub's 6-hour limit.
        timeout-minutes: 15
        run: cargo test --no-fail-fast --tests
      - name: CLI starts without existing state
        shell: pwsh
        run: target/debug/porch.exe --state-dir "$env:RUNNER_TEMP/porch-smoke" list --json
      - run: cargo build --features tray --bin porch-tray
      - run: python scripts/test_packaging.py
      - run: python scripts/package.py --target x86_64-pc-windows-msvc --binaries target/debug
  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: cargo clippy --features tray --all-targets -- -D warnings
      - run: cargo test --features tray --lib tray::tests
      - run: python3 scripts/test_packaging.py
      # A debug build shares dependencies with the test above; release.yml
      # builds the optimized tray for every tag.
      - run: cargo build --features tray --bin porch-tray
      - if: runner.os == 'Linux'
        name: Tray fails clearly without a desktop
        run: |
          # The CLI is never invoked before the desktop check fails, so a
          # placeholder satisfies PORCH_BIN; the real CLI is built by `test`.
          printf '#!/bin/sh\nexit 97\n' > "$RUNNER_TEMP/porch"
          chmod +x "$RUNNER_TEMP/porch"
          python3 - <<'PY'
          import os, subprocess
          env = dict(os.environ)
          env.pop('DISPLAY', None)
          env.pop('WAYLAND_DISPLAY', None)
          env['PORCH_BIN'] = os.path.join(os.environ['RUNNER_TEMP'], 'porch')
          result = subprocess.run(['target/debug/porch-tray'], env=env, capture_output=True, text=True, timeout=10)
          assert result.returncode != 0, result
          assert 'porch list --all' in result.stderr, result.stderr
          PY
  installers:
    # scripts/install.sh: lint it, then install the latest release into a
    # temporary home, once with gh logged out (the attestation check must be
    # skipped with a note) and once with a token (it must verify).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh
      - name: Install without a gh login
        run: |
          home="$RUNNER_TEMP/home-anonymous"
          mkdir -p "$home"
          env -u GH_TOKEN -u GITHUB_TOKEN HOME="$home" GH_CONFIG_DIR="$home/gh" \
            PORCH_APP_DIR="$home/Applications" sh scripts/install.sh | tee "$RUNNER_TEMP/anonymous.log"
          grep -q 'Skipped the build attestation check' "$RUNNER_TEMP/anonymous.log"
          "$home/.local/bin/porch" --version
      - name: Install with the attestation required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          home="$RUNNER_TEMP/home-verified"
          mkdir -p "$home"
          HOME="$home" GH_CONFIG_DIR="$home/gh" PORCH_APP_DIR="$home/Applications" \
            PORCH_UPDATE_VERIFY=require sh scripts/install.sh | tee "$RUNNER_TEMP/verified.log"
          grep -q 'Verified build attestation: built by .* from refs/tags/v' "$RUNNER_TEMP/verified.log"
          "$home/.local/bin/porch" --version
          # Running it again replaces the installed copy in place.
          HOME="$home" PORCH_APP_DIR="$home/Applications" sh scripts/install.sh >/dev/null
  installers-windows:
    # scripts/install.ps1: lint it, then run it as `irm ... | iex` does, in
    # Windows PowerShell 5.1, into a temporary LOCALAPPDATA.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Repository PSGallery -Scope CurrentUser -Force
          # An installer talks to the person running it: Write-Host is intended.
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($issues) { exit 1 }
      - name: Install with irm | iex
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'Continue'
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression
          if ($ErrorActionPreference -ne 'Continue' -or $ProgressPreference -ne 'Continue') {
            throw 'install.ps1 changed preferences in the calling session'
          }
          $porch = Join-Path $env:LOCALAPPDATA 'Programs\Porch\bin\porch.exe'
          & $porch --version
          if ($LASTEXITCODE -ne 0) { throw "porch.exe --version failed" }
          # Again over the installed copy, which moves it aside.
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression
          & $porch --version
          if ($LASTEXITCODE -ne 0) { throw "porch.exe --version failed after reinstall" }
