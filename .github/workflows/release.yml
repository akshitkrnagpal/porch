name: Release
# Pushing a tag vX.Y.Z (matching Cargo.toml) builds every target, publishes a
# GitHub Release with the tarballs and SHA256SUMS, then updates the Homebrew tap.
# A manual run builds and uploads workflow artifacts only; it never publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Tag must match Cargo.toml version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          echo "Cargo.toml version: $version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match Cargo.toml version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: macos-15
            target: aarch64-apple-darwin
            test: true
          # Cross-compiled on the Apple Silicon runner; not executed in CI.
          - os: macos-15
            target: x86_64-apple-darwin
            test: false
          # Built natively. The test suite does not pass on Windows yet; the
          # smoke steps below still run the built binary.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            test: false
          # Static, CLI-only Linux builds: no glibc version requirement, so they
          # run on older distributions, Alpine and ARM64 servers. Built with
          # cargo-zigbuild; the x86_64 one is smoke-run below.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            test: false
            musl: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            test: false
            musl: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PORCH_TEST_TURBO_REQUIRED: "1"
      PORCH_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - if: matrix.test
        run: npm install --global turbo@2.6.3
      - if: runner.os == 'Linux' && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev
      - if: matrix.musl
        run: |
          python3 -m pip install ziglang==0.13.0
          cargo install --locked cargo-zigbuild@0.19.8
      - if: matrix.test
        run: cargo test --features tray --lib tray::tests
      - if: matrix.test
        run: python3 scripts/test_packaging.py
      - if: matrix.test
        # Fat LTO with one codegen unit on every test binary would add many
        # minutes, so tests use the release profile's opt-level without it.
        # The shipped binaries below get the full profile and are smoke-run.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --no-fail-fast --release --target ${{ matrix.target }} --all-targets
      - if: '!matrix.musl'
        run: cargo build --release --target ${{ matrix.target }} --bin porch
      - if: '!matrix.musl'
        run: cargo build --release --target ${{ matrix.target }} --features tray --bin porch-tray
      - if: matrix.musl
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin porch
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        name: Static build runs and reports the release version
        run: |
          file target/${{ matrix.target }}/release/porch | grep -Eq 'statically linked|static-pie linked'
          target/${{ matrix.target }}/release/porch --version | grep -Fx "porch ${{ needs.version.outputs.version }}"
      - if: matrix.test || runner.os == 'Windows'
        name: Built binary reports the release version
        run: target/${{ matrix.target }}/release/porch --version | tr -d '\r' | grep -Fx "porch ${{ needs.version.outputs.version }}"
      - if: runner.os == 'Windows'
        run: python scripts/test_packaging.py
      # setup-python provides `python` on every runner; `python3` is not on Windows.
      - run: python scripts/package.py --target ${{ matrix.target }} --binaries target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@v7
        with:
          name: porch-${{ matrix.target }}
          path: dist/porch-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance: `gh attestation verify` (and `porch self-update`)
      # can prove each archive came from this workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: porch-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum porch-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/porch-*.tar.gz
            dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Porch $TAG" --generate-notes --verify-tag
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  homebrew:
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: akshitkrnagpal/homebrew-tap
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update. Render it locally with scripts/render_formula.py."
      - if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - if: env.HOMEBREW_TAP_TOKEN != ''
        name: Commit Formula/porch.rb to the tap
        run: |
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          python3 scripts/render_formula.py --version "$VERSION" --sums dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --output tap/Formula/porch.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/porch.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "porch ${VERSION}"
          git push origin HEAD

  npm:
    # Publishes porch-cli and its per-platform binary packages with npm
    # provenance. Skipped until the NPM_TOKEN secret is set.
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; skipping npm publishing. Build the packages locally with scripts/build_npm.py."
      - if: env.NPM_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - if: env.NPM_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: porch-*
          merge-multiple: true
      - if: env.NPM_TOKEN != ''
        name: Build and publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          python3 scripts/build_npm.py --version "$VERSION" --dist dist --output npm-dist
          # Platform packages first, so the launcher never points at a missing one.
          for package in npm-dist/porch-cli-*; do
            npm publish "$package" --provenance --access public
          done
          npm publish npm-dist/porch-cli --provenance --access public
