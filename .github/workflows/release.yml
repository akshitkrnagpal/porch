name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: porch
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: porch
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: porch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --release --target ${{ matrix.target }} --all-targets
      - run: cargo build --release --target ${{ matrix.target }} --bin porch
      - uses: actions/upload-artifact@v4
        with:
          name: porch-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
