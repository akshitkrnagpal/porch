name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PORCH_TEST_TURBO_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-ci.yml-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global turbo@2.6.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast --all-targets
      - run: cargo build --release
  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-tray-${{ hashFiles('Cargo.lock') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: cargo clippy --features tray --all-targets -- -D warnings
      - run: cargo test --features tray --lib tray::tests
      - run: python3 scripts/test_packaging.py
      - run: cargo build --release --bin porch
      - run: cargo build --release --features tray --bin porch-tray
      - if: runner.os == 'Linux'
        name: Headless CLI stays independent of desktop libraries
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY target/release/porch --state-dir "$RUNNER_TEMP/porch-headless" list --json
          if ldd target/release/porch | grep -Ei 'gtk|gdk|appindicator|cairo'; then exit 1; fi
          python3 - <<'PY'
          import os, subprocess
          env = dict(os.environ)
          env.pop('DISPLAY', None)
          env.pop('WAYLAND_DISPLAY', None)
          env['PORCH_BIN'] = os.path.abspath('target/release/porch')
          result = subprocess.run(['target/release/porch-tray'], env=env, capture_output=True, text=True, timeout=10)
          assert result.returncode != 0, result
          assert 'porch list --all' in result.stderr, result.stderr
          PY
