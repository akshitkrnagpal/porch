[package]
name = "porch"
version = "0.3.2"
edition = "2021"
description = "Stable named URLs for local dev servers, across your machines"
license = "MIT"
repository = "https://github.com/akshitkrnagpal/porch"
homepage = "https://github.com/akshitkrnagpal/porch"
readme = "README.md"
keywords = ["dev-server", "proxy", "localhost", "monorepo", "tailscale"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.28"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }
url = "2"
bytes = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "http2", "ring", "tls12"] }
sha2 = "0.10"
mdns-sd = "0.17"
serde_yaml = "0.9"
socket2 = "0.6"
getrandom = "0.3"

rustls-native-certs = "0.8"
spake2 = "0.4"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = []
tray = ["dep:tray-icon", "dep:tao", "dep:gtk", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[[bin]]
name = "porch-tray"
path = "src/bin/porch-tray.rs"
required-features = ["tray"]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "0.37", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSGeometry", "NSObject", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSCell", "NSControl", "NSFont", "NSMenu", "NSEvent", "NSMenuItem", "NSProgressIndicator", "NSResponder", "NSSwitch", "NSText", "NSTextField", "NSView"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[profile.dev]
# Keep only line tables in debug builds: much smaller target/, and
# backtraces still show file:line.
debug = "line-tables-only"
